name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/

      - name: Import smoke test
        # We can't run real Nexus interaction in CI, but we can verify the
        # package imports cleanly without browser-harness installed by
        # mocking it. This catches syntax errors and broken imports.
        run: |
          python -c "
          import sys, types
          # Stub browser_harness so import works without the real Chrome.
          bh = types.ModuleType('browser_harness')
          sw = types.ModuleType('browser_harness.second_window')
          for name in ('ensure_agent_tab', 'evaluate_agent', 'find_agent_tab', 'navigate_agent'):
              setattr(sw, name, lambda *a, **kw: None)
          helpers = types.ModuleType('browser_harness.helpers')
          for name in ('cdp', 'drain_events'):
              setattr(helpers, name, lambda *a, **kw: None)
          sys.modules['browser_harness'] = bh
          sys.modules['browser_harness.second_window'] = sw
          sys.modules['browser_harness.helpers'] = helpers

          sys.path.insert(0, 'src')
          import nexus_mods_toolkit
          assert hasattr(nexus_mods_toolkit, 'upload_mod')
          assert hasattr(nexus_mods_toolkit, 'add_new_file_version')
          assert hasattr(nexus_mods_toolkit, 'download_mod')
          print('OK', nexus_mods_toolkit.__version__)
          "
